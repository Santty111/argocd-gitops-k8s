apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-gitops-deployment
  labels:
    app: web-gitops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-gitops
  template:
    metadata:
      labels:
        app: web-gitops
    spec:
      containers:
      - name: nginx-web
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
